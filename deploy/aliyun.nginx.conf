# Merge these locations into the EXISTING server block for vrchat.maao.cc.
# Preserve your TLS, root, cache, and other deployment settings.
# Cloudflare Pages already has the equivalent fallback in public/_redirects.

# Path-style photo links (including /123/) must serve the Vue entry point.
location ~ ^/[0-9]+/?$ {
    rewrite ^ /index.html last;
}

# Existing statistics route also needs the SPA entry point on direct requests.
location = /statistics {
    rewrite ^ /index.html last;
}
location = /statistics/ {
    rewrite ^ /index.html last;
}

# Alternative, if this host is exclusively the SPA:
# location / {
#     try_files $uri $uri/ /index.html;
# }
